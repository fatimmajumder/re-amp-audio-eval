services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reamp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reamp
      REAMP_STORAGE_BACKEND: database
      REAMP_INLINE_WORKERS: "false"
      REAMP_WORKER_COUNT: "2"
      REAMP_WORKER_POLL_INTERVAL: "1.0"
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  worker:
    build: .
    command: python scripts/run_worker.py
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reamp
      REAMP_STORAGE_BACKEND: database
      REAMP_INLINE_WORKERS: "false"
      REAMP_WORKER_COUNT: "2"
      REAMP_WORKER_POLL_INTERVAL: "1.0"
    depends_on:
      - postgres

volumes:
  postgres_data:
