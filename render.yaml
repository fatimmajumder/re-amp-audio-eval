services:
  - type: web
    name: re-amp-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: REAMP_STORAGE_BACKEND
        value: json
      - key: REAMP_INLINE_WORKERS
        value: "true"
      - key: REAMP_WORKER_COUNT
        value: "2"
      - key: REAMP_WORKER_POLL_INTERVAL
        value: "1.0"
